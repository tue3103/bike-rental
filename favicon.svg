<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="bikeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#10b981" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#bikeGrad)" stroke-width="12"/>

  <!-- Bicycle Graphic -->
  <g transform="translate(45, 100)" stroke="url(#bikeGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
    <!-- Back Wheel -->
    <circle cx="85" cy="220" r="75"/>
    <!-- Front Wheel -->
    <circle cx="335" cy="220" r="75"/>
    
    <!-- Bike Frame -->
    <polygon points="85,220 185,220 280,110 160,110" />
    <line x1="85" y1="220" x2="160" y2="110"/>
    <line x1="185" y1="220" x2="335" y2="220"/>
    <line x1="280" y1="110" x2="335" y2="220"/>

    <!-- Handlebars -->
    <path d="M280,110 L270,70 L305,65"/>
    <!-- Seat -->
    <line x1="160" y1="110" x2="150" y2="80"/>
    <line x1="125" y1="80" x2="175" y2="80" stroke-width="26"/>
  </g>
</svg>
